name: SDKA Engineering Contracts
on:
  pull_request:
    paths:
      - 'schemas/engineering-assessment.schema.json'
      - 'schemas/connector-operation.schema.json'
      - 'examples/engineering-assessment.example.json'
      - 'examples/connector-operation.example.json'
      - 'scripts/validate_engineering_contracts.py'
      - 'scripts/test_engineering_contracts.py'
      - 'scripts/sdka_registry_gate.py'
      - 'scripts/test_skill_bootstrap.py'
      - 'skills/sertaodigital-core/workflows/skill-routing-and-onboarding.md'
      - 'AGENTS.md'
      - 'repositories.yaml'
      - 'products.yaml'
      - 'knowledge.yaml'
      - '.github/workflows/engineering-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validation dependency
        run: python -m pip install 'jsonschema==4.23.0' 'PyYAML==6.0.2'
      - name: Validate JSON and references offline
        run: python scripts/validate_engineering_contracts.py
      - name: Validate schemas and negative test cases
        run: python -m unittest discover -s scripts -p 'test_engineering_contracts.py' -v
      - name: Check active skill catalog and bootstrap
        run: python -m unittest discover -s scripts -p 'test_skill_bootstrap.py' -v
