name: SDKA Engineering Contracts
on:
  pull_request:
    paths:
      - 'schemas/engineering-assessment.schema.json'
      - 'schemas/connector-operation.schema.json'
      - 'examples/engineering-assessment.example.json'
      - 'examples/connector-operation.example.json'
      - 'scripts/validate_engineering_contracts.py'
      - 'scripts/test_engineering_contracts.py'
      - 'scripts/sdka_registry_gate.py'
      - 'scripts/sdka_skill_router.py'
      - 'scripts/test_skill_router.py'
      - 'scripts/sdka_skill_discovery.py'
      - 'scripts/test_skill_discovery.py'
      - 'scripts/sdka_task_guidance.py'
      - 'scripts/test_task_guidance.py'
      - 'scripts/test_phase10_simulation.py'
      - 'scripts/sdka_evidence_assessment.py'
      - 'scripts/test_evidence_assessment.py'
      - 'scripts/sdka_product_inventory.py'
      - 'scripts/test_product_inventory.py'
      - 'scripts/test_initial_product_skills.py'
      - 'scripts/sdka_code_evidence.py'
      - 'scripts/test_code_evidence.py'
      - 'examples/phase11-2-code-evidence.json'
      - 'scripts/sdka_integrity_audit.py'
      - 'scripts/test_integrity_audit.py'
      - 'scripts/sdka_governance_report.py'
      - 'scripts/test_governance_report.py'
      - 'skills/sigi-sd/SKILL.md'
      - 'skills/veredas/SKILL.md'
      - 'skills/sertaodigital-core/workflows/skill-routing-and-onboarding.md'
      - 'AGENTS.md'
      - 'repositories.yaml'
      - 'products.yaml'
      - 'knowledge.yaml'
      - '.github/workflows/engineering-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validation dependency
        run: python -m pip install 'jsonschema==4.23.0' 'PyYAML==6.0.2'
      - name: Validate JSON and references offline
        run: python scripts/validate_engineering_contracts.py
      - name: Validate schemas and negative test cases
        run: python -m unittest discover -s scripts -p 'test_engineering_contracts.py' -v
      - name: Validate skill bootstrap and multi-product routing
        run: python -m unittest discover -s scripts -p 'test_skill_router.py' -v
      - name: Validate language discovery
        run: python -m unittest discover -s scripts -p 'test_skill_discovery.py' -v
      - name: Validate guided task intent
        run: python -m unittest discover -s scripts -p 'test_task_guidance.py' -v
      - name: Simulate phase 10 operational scenarios offline
        run: python -m unittest discover -s scripts -p 'test_phase10_simulation.py' -v
      - name: Verify phase 11 evidence assessments offline
        run: python -m unittest discover -s scripts -p 'test_evidence_assessment.py' -v
      - name: Validate all catalogued products
        run: python -m unittest discover -s scripts -p 'test_product_inventory.py' -v
      - name: Validate inactive initial product skills
        run: python -m unittest discover -s scripts -p 'test_initial_product_skills.py' -v
      - name: Validate phase 11.2 source evidence offline
        run: python -m unittest discover -s scripts -p 'test_code_evidence.py' -v
      - name: Audit canonical registries
        run: python scripts/sdka_integrity_audit.py
      - name: Verify integrity negative scenarios
        run: python -m unittest discover -s scripts -p 'test_integrity_audit.py' -v
      - name: Verify offline governance report
        run: python -m unittest discover -s scripts -p 'test_governance_report.py' -v
